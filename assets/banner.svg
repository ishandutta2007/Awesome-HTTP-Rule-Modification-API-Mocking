<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-15px) scale(1.05); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(12px) scale(0.96); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        50% { opacity: 0.45; transform: scale(1.15); }
      }
      @keyframes signalFlow {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(380px); opacity: 0; }
      }
      .orb-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
      .floating-node-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-node-2 { animation: floatFast 6s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="200" cy="120" r="140" fill="#0284c7" filter="url(#orbGlow)" />
  <circle class="orb-2" cx="1020" cy="280" r="160" fill="#7c3aed" filter="url(#orbGlow)" />

  <!-- Animated Data Interception Stream Lines (Background) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 80,80 C 350,150 450,40 750,90 S 1120,50 1150,80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 50,340 C 300,280 500,380 820,330 S 1080,380 1150,340" fill="none" stroke="#a855f7" stroke-width="2" style="animation-direction: reverse; animation-duration: 4s;" />
  </g>

  <!-- Interactive/Dynamic Visual Decorative Cards (Sides) -->
  <!-- Left Decorative Packet Card -->
  <g class="floating-node-1" transform="translate(60, 160)" opacity="0.85">
    <rect width="200" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="30" r="6" fill="#ef4444" />
    <circle cx="48" cy="30" r="6" fill="#f59e0b" />
    <circle cx="68" cy="30" r="6" fill="#10b981" />
    <rect x="20" y="52" width="100" height="8" rx="4" fill="#38bdf8" fill-opacity="0.7"/>
    <rect x="20" y="68" width="140" height="6" rx="3" fill="#64748b" fill-opacity="0.5"/>
    <text x="140" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">REQ / 200</text>
  </g>

  <!-- Right Decorative Rule Card -->
  <g class="floating-node-2" transform="translate(940, 150)" opacity="0.85">
    <rect width="200" height="95" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c084fc">⚡ RULE MODIFIER</text>
    <rect x="22" y="46" width="156" height="18" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="32" y="59" font-family="monospace" font-size="10" fill="#a5b4fc">Rewrite: /v1/api/*</text>
    <rect x="22" y="72" width="90" height="12" rx="4" fill="#065f46"/>
    <text x="30" y="81" font-family="monospace" font-size="9" font-weight="bold" fill="#34d399">STATUS: MOCKED</text>
  </g>

  <!-- Central Foreground Content (Title & Subtitle permanently clear in foreground) -->
  <g id="foreground-content">
    <!-- Top Pill -->
    <g transform="translate(450, 68)">
      <rect width="300" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="20" cy="16" r="5" fill="#10b981" filter="url(#glow)"/>
      <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#glow)">
      HTTP RULE MODIFICATION &amp; API MOCKING
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Request Interception • Response Mocking • Debugging Proxies • Network Emulation
    </text>

    <!-- Feature Badges Flow in Foreground -->
    <g transform="translate(245, 260)">
      <!-- Badge 1: MITM Proxies -->
      <g transform="translate(0, 0)">
        <rect width="165" height="38" rx="19" fill="#111827" stroke="#38bdf8" stroke-width="1.2" />
        <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ MITM Proxies</text>
      </g>
      <!-- Badge 2: API Virtualization -->
      <g transform="translate(180, 0)">
        <rect width="180" height="38" rx="19" fill="#111827" stroke="#818cf8" stroke-width="1.2" />
        <text x="90" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#818cf8">🎭 API Virtualization</text>
      </g>
      <!-- Badge 3: Browser Rewriting -->
      <g transform="translate(375, 0)">
        <rect width="185" height="38" rx="19" fill="#111827" stroke="#c084fc" stroke-width="1.2" />
        <text x="92" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🔀 Browser Rewriting</text>
      </g>
      <!-- Badge 4: Chaos & Delays -->
      <g transform="translate(575, 0)">
        <rect width="165" height="38" rx="19" fill="#111827" stroke="#f43f5e" stroke-width="1.2" />
        <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fb7185">⏱ Chaos &amp; Latency</text>
      </g>
    </g>

    <!-- Sub-footer stats/callout in foreground -->
    <text x="600" y="345" text-anchor="middle" font-family="monospace" font-size="13" font-weight="500" fill="#64748b">
      SaaS Platforms • Open-Source Powerhouses • Self-Hosted Toolkits • Zero-Config Extensions
    </text>
  </g>
</svg>